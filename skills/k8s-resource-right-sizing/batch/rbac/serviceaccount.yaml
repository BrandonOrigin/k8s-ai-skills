# ServiceAccount for unattended runs (the CronJob in ../README.md's CI/CD
# section). Change the namespace to wherever you run the batch scan from;
# it does not need to live in every namespace being scanned -- the
# ClusterRoleBinding grants cluster-wide read access regardless of where
# this ServiceAccount is created.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rightsizing-scanner
  namespace: platform-tools
