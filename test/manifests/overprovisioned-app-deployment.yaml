# Scenario 1: over-provisioned CPU & memory.
#
# Two containers per pod on purpose (exercises skill1's per-container, not
# per-pod, analysis unit):
#   - app:       CPU-bound HTTP server, requests deliberately set high
#                relative to the load the generator (step 5) will produce,
#                so skill1 has a real over-provisioning case to detect.
#   - log-agent: trivial sidecar with small, roughly-accurate requests, so
#                skill1's per-container recommendations can be compared
#                against a container that's already close to right-sized.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: overprovisioned-app
  namespace: test-workload
  labels:
    app: overprovisioned-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: overprovisioned-app
  template:
    metadata:
      labels:
        app: overprovisioned-app
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python3", "/scripts/app.py"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          volumeMounts:
            - name: script
              mountPath: /scripts
        - name: log-agent
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo tick; sleep 30; done"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: script
          configMap:
            name: overprovisioned-app-script
