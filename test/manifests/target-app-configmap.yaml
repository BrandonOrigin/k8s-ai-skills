# CPU-bound HTTP server: each request does a configurable amount of busy
# work, so CPU usage scales with the request rate/size the load generator
# (step 5) sends. Runs on stock python:3.12-alpine — no custom image build.
apiVersion: v1
kind: ConfigMap
metadata:
  name: target-app-script
  namespace: test-workload
data:
  app.py: |
    import http.server
    import socketserver
    from urllib.parse import urlparse, parse_qs

    PORT = 8080

    def busy_work(iterations):
        total = 0
        for i in range(iterations):
            total += i * i
        return total

    class Handler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            qs = parse_qs(urlparse(self.path).query)
            iterations = int(qs.get("work", ["200000"])[0])
            busy_work(iterations)
            self.send_response(200)
            self.end_headers()
            self.wfile.write(b"ok\n")

        def log_message(self, format, *args):
            pass  # quiet — avoid log-driven CPU/IO noise

    with socketserver.TCPServer(("", PORT), Handler) as httpd:
        httpd.serve_forever()
